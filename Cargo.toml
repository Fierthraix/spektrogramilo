[package]
name = "spektrogramilo"
version = "0.1.1"
edition = "2024"
description = "WebAssembly-bazita realtempa sona spektrogramilo"
repository = "https://github.com/Fierthraix/spektrogramilo"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2.121"
web-sys = { version = "0.3.98", features = [
    "AudioContext",
    "AudioWorkletNode",
    "MediaStream",
    "MediaStreamAudioSourceNode",
    "Navigator",
    "MediaDevices",
    "Window",
    "AnalyserNode",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "Document",
    "Element",
    "HtmlElement",
    "MediaStreamConstraints",
    "ImageData"
]}
js-sys = "0.3.98"
console_error_panic_hook = "0.1"
wasm-bindgen-futures = "0.4.71"
rustfft = "6.4.1"
num-complex = "0.4"
